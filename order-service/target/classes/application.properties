spring.application.name=order-service

# H2 in-memory database (data is reset on restart)
spring.datasource.url=jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Schema is generated from the JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:ordersdb)
spring.h2.console.enabled=true
